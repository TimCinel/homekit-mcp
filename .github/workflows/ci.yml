name: Build and security regression tests

on:
  push:
    branches: [main, master, develop, 'security/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test production protocol and Unix transport without HomeKit
        run: swift test
      - name: Test stdio relay security regressions
        run: python3 -m unittest discover -s tests -v
      - name: Build actual Catalyst app without signing or running
        run: >-
          xcodebuild -project HomeKitSync.xcodeproj -scheme HomeKitSync
          -configuration Debug -destination 'platform=macOS,variant=Mac Catalyst'
          CODE_SIGNING_ALLOWED=NO build
